[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docextract"
version = "0.1.0"
description = "Production-style Invoice Document Data Extractor (OCR + NER + regex + FastAPI)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0.1",
  "numpy>=1.24",
  "pandas>=2.0",
  "pydantic>=2.6",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "python-multipart>=0.0.9",
  "pytesseract>=0.3.10",
  "Pillow>=10.0",
  "opencv-python>=4.8",
  "transformers>=4.40",
  "torch>=2.2",
  "joblib>=1.3",
  "psycopg2-binary>=2.9",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
  "anyio>=4.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
