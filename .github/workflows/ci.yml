name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project dependencies
        run: python -m pip install -e ".[dev]"
      - name: Validate golden set
        run: make golden
      - name: Run golden evaluation smoke gate
        run: make eval
      - name: Run tests
        run: pytest
