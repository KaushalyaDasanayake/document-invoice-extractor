version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docextract-api
    ports:
      - "8000:8000"
    environment:
      - DOCEXTRACT_API_KEY=dev-key-change-in-prod
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
